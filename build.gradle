plugins {
    id 'java'
    id 'application'
    id 'checkstyle'
    id 'pmd'
}

checkstyle {
    toolVersion = '10.21.4'
    configFile = file('config/checkstyle/checkstyle.xml')
    showViolations = true
}

pmd {
    toolVersion = '7.9.0'
    ruleSetFiles = files('config/pmd/pmd-ruleset.xml')
    ruleSets = []
    consoleOutput = true
}

// Checkstyle's ANTLR grammar cannot process JPMS module declarations;
// module-info.java is excluded from style analysis (documented policy).
tasks.withType(Checkstyle).configureEach {
    source = source.matching { exclude '**/module-info.java' }
}

version = providers.gradleProperty('releaseVersion')
        .orElse('0.0.0-dev')
        .get()

configurations.all {
    resolutionStrategy {
        force 'com.github.oshi:oshi-core:6.4.10'
    }
}

dependencies {
    implementation 'com.github.oshi:oshi-core:6.4.10'
    implementation 'net.java.dev.jna:jna:5.14.0'
    implementation 'net.java.dev.jna:jna-platform:5.14.0'
    implementation 'org.slf4j:slf4j-api:2.0.13'
    implementation 'org.tinylog:tinylog-api:2.5.0'
    implementation 'org.tinylog:tinylog-impl:2.5.0'

    implementation 'org.jline:jline:3.27.1'

    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.0'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation 'org.mockito:mockito-core:5.11.0'

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}


java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

application {
    mainClass = 'io.jmon.app.Main'
    applicationName = 'jmon'
    applicationDefaultJvmArgs = ["-Djmon.version=${project.version}"]
}

test {
    useJUnitPlatform()
}
