name: Release JMon

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Test and build distribution
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # check = test + Checkstyle + strict PMD + ArchUnit + review PMD
          ./gradlew -PreleaseVersion="$VERSION" clean check build installDist

      - name: Verify Windows launcher
        run: |
          test -f build/install/jmon/bin/jmon.bat
          echo "Windows launcher found."

      - name: Package distributions
        run: |
          tar -czf jmon.tar.gz -C build/install jmon
          sha256sum jmon.tar.gz > jmon.tar.gz.sha256
          
          cd build/install
          zip -r ../../jmon-windows.zip jmon
          cd ../..
          
          unzip -l jmon-windows.zip
          unzip -Z1 jmon-windows.zip | grep -Fx "jmon/bin/jmon.bat"
          
          sha256sum jmon-windows.zip > jmon-windows.zip.sha256

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            jmon.tar.gz
            jmon.tar.gz.sha256
            jmon-windows.zip
            jmon-windows.zip.sha256