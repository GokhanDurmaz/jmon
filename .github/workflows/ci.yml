name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: write

jobs:
  verify:
    name: Test, style checks and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      # check = test + Checkstyle (main/test) + strict PMD (main/test) +
      # ArchUnit architecture rules + review-tier PMD (informational).
      - name: Run full verification
        run: ./gradlew clean check build --stacktrace 2>&1 | tee /tmp/build.log; exit ${PIPESTATUS[0]}

      - name: Publish verification log tail
        if: failure()
        run: |
          echo "### Build failure tail" >> "$GITHUB_STEP_SUMMARY"
          echo "```text" >> "$GITHUB_STEP_SUMMARY"
          tail -n 200 /tmp/build.log >> "$GITHUB_STEP_SUMMARY"
          echo "```" >> "$GITHUB_STEP_SUMMARY"
          mkdir -p qa
          tail -n 400 /tmp/build.log > qa/last-verification.log
      - name: Commit diagnostic log (temporary)
        if: failure()
        run: |
          git config user.name "ci-diagnostics"
          git config user.email "ci@invalid"
          git add qa/last-verification.log
          git commit -m "ci: verification log for run ${{ github.run_id }}"
          git push origin HEAD:main

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-quality-reports
          path: |
            build/reports/tests
            build/reports/checkstyle
            build/reports/pmd
          if-no-files-found: ignore
